openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/mobile/google/config:
    get:
      operationId: getGoogleMobileSignInConfig
      tags: [auth]
      summary: Check browser Google sign-in availability
      description: Indicates whether Google browser sign-in is configured without exposing provider credentials.
      responses:
        "200":
          description: Google sign-in readiness
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  enabled:
                    type: boolean
                required: [enabled]
  /auth/mobile/google/complete:
    post:
      operationId: completeGoogleMobileSignIn
      tags: [auth]
      summary: Complete a PKCE-bound Google mobile sign-in
      description: Exchanges a short-lived browser handoff ticket and its PKCE verifier for a normal LUDI mobile JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleMobileSignInRequest"
      responses:
        "200":
          description: Google mobile sign-in completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  token:
                    type: string
                    description: Normal long-lived LUDI mobile application JWT.
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: [string, "null"]
                      firstName:
                        type: [string, "null"]
                      lastName:
                        type: [string, "null"]
                      profileImageUrl:
                        type: [string, "null"]
                    required: [id]
                    additionalProperties: true
                required: [success, token, user]
        "400":
          description: Missing ticket or verifier
        "401":
          description: Invalid, expired, or PKCE-mismatched handoff ticket
  /fee-settings:
    get:
      operationId: getFeeSettings
      tags: [fees]
      responses:
        "200":
          description: Current settings for new events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeSettings"
  /admin/fees:
    get:
      operationId: getFeeAdminState
      tags: [fees]
      responses:
        "200":
          description: SuperAdmin fee settings and audit history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeAdminState"
        "403":
          description: SuperAdmin access required
    put:
      operationId: updateFeeSettings
      tags: [fees]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeSettings"
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeAdminState"
        "409":
          description: Another administrator changed the revision
        "403":
          description: SuperAdmin access required
  /admin/access:
    get:
      operationId: getPlatformAdminAccess
      tags: [notificationAdmin]
      responses:
        "200":
          description: Authenticated user's platform permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAdminAccess"
  /admin/notifications:
    get:
      operationId: getNotificationAdminState
      tags: [notificationAdmin]
      responses:
        "200":
          description: SuperAdmin notification configuration and recent delivery attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationAdminState"
  /admin/notifications/templates:
    post:
      operationId: createPushTemplate
      tags: [notificationAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTemplateInput"
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTemplate"
  /admin/notifications/templates/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    put:
      operationId: updatePushTemplate
      tags: [notificationAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTemplateInput"
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTemplate"
    delete:
      operationId: deletePushTemplate
      tags: [notificationAdmin]
      responses:
        "204": { description: Unassigned template deleted }
        "409": { description: Template is assigned to a trigger }
  /admin/notifications/triggers:
    post:
      operationId: createPushTrigger
      tags: [notificationAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushNotificationInput"
      responses:
        "201":
          description: Notification created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTrigger"
  /admin/notifications/triggers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    delete:
      operationId: deletePushTrigger
      tags: [notificationAdmin]
      responses:
        "204": { description: Notification removed }
        "404": { description: Notification not found }
    put:
      operationId: updatePushTrigger
      tags: [notificationAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTriggerInput"
      responses:
        "200":
          description: Trigger updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTrigger"
  /admin/notifications/preview:
    post:
      operationId: previewPushTemplate
      tags: [notificationAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushPreviewInput"
      responses:
        "200":
          description: Rendered example, not sent to any device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPreview"
  /admin/notifications/test:
    post:
      operationId: sendPushTemplateTest
      tags: [notificationAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTestInput"
      responses:
        "202":
          description: Queued for the signed-in SuperAdmin's opted-in devices
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: integer }
        "409": { description: No opted-in APNs devices registered }
        "503": { description: Apple credentials not configured }
  /push/devices:
    post:
      operationId: registerApplePushDevice
      tags: [pushDevices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplePushDeviceInput"
      responses:
        "200":
          description: Device registered to authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushDeviceResult"
    delete:
      operationId: unregisterApplePushDevice
      tags: [pushDevices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceRemoval"
      responses:
        "204": { description: Device disabled for authenticated user }
  /objects/upload:
    post:
      operationId: requestTeamPictureUpload
      summary: Request a signed upload URL for a team picture
      responses:
        "200":
          description: Upload bytes directly to uploadURL, then save objectPath on the team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPictureUpload"
        "401": { description: Authentication required }
        "500": { description: Storage unavailable }
  /users/profile-picture:
    put:
      operationId: updateProfilePicture
      summary: Change or remove the authenticated user's optional profile photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePictureChangeInput"
      responses:
        "200":
          description: Saved profile photo; null means removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePictureRecord"
        "400": { description: Invalid picture path or unsupported image }
        "401": { description: Authentication required }
        "404": { description: Account or uploaded picture not found }
        "503": { description: Storage could not verify the picture }
  /teams:
    get:
      operationId: listLudiTeams
      summary: List active teams or archived teams belonging to the signed-in user
      parameters:
        - in: query
          name: archived
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Owner and member teams with history retained
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamListRecord" }
        "400": { description: Invalid archive filter }
        "401": { description: Authentication required }
    post:
      operationId: createLudiTeam
      summary: Create a team with an optional previously uploaded picture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreationInput"
      responses:
        "200":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamRecord"
        "400": { description: Invalid team or picture }
        "401": { description: Authentication required }
        "503": { description: Picture could not be verified }
  /teams/{id}:
    put:
      operationId: updateLudiTeam
      summary: Update team settings; only the owner can change or remove its picture
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamSettingsInput"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamRecord"
        "400": { description: Invalid picture }
        "401": { description: Authentication required }
        "403": { description: Requires team admin; picture changes require team ownership }
        "404": { description: Team not found }
        "409": { description: Team name already exists or team is archived }
        "503": { description: Picture could not be verified }
  /teams/{id}/archive:
    post:
      operationId: archiveLudiTeam
      summary: Owner-only reversible archival
      description: Preserves memberships, invitations and all event/financial history. Existing upcoming events are not cancelled or refunded. Recurring generation pauses while a linked team is archived.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Archived team, including idempotent retries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamRecord" }
        "401": { description: Authentication required }
        "403": { description: Team owner required }
        "404": { description: Team not found }
  /teams/{id}/restore:
    post:
      operationId: restoreLudiTeam
      summary: Restore an archived team as its owner
      description: Resumes team changes and recurring generation; separately suspended series remain suspended. No event or payment changes.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Restored team, including idempotent retries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamRecord" }
        "401": { description: Authentication required }
        "403": { description: Team owner required }
        "404": { description: Team not found }
components:
  schemas:
    TeamListRecord:
      allOf:
        - $ref: "#/components/schemas/TeamRecord"
        - type: object
          required: [role, memberCount, isOwner]
          properties:
            role: { type: string }
            memberCount: { type: integer }
            isOwner: { type: boolean }
    ProfilePictureChangeInput:
      type: object
      additionalProperties: false
      required: [objectPath]
      properties:
        objectPath:
          type: [string, "null"]
          pattern: '^/objects/uploads/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    ProfilePictureRecord:
      type: object
      required: [profileImageUrl]
      properties:
        profileImageUrl: { type: [string, "null"] }
    TeamPictureUpload:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    TeamCreationInput:
      type: object
      required: [name, sports]
      properties:
        name: { type: string }
        description: { type: [string, "null"] }
        sports:
          type: array
          items: { type: string }
        color: { type: [string, "null"] }
        maxPlayers: { type: [integer, "null"] }
        gender: { type: string, enum: [male, female, mixed] }
        isPrivate: { type: boolean }
        requiresApproval: { type: boolean }
        teamImagePath: { type: [string, "null"], description: "Optional uploaded object path. Omit or use null for no picture." }
    TeamSettingsInput:
      type: object
      properties:
        name: { type: string }
        description: { type: [string, "null"] }
        sports:
          type: array
          items: { type: string }
        isPrivate: { type: boolean }
        requiresApproval: { type: boolean }
        teamImagePath: { type: [string, "null"], description: "Omit to keep the current picture; null removes it. Only the team owner may set this field." }
    TeamRecord:
      type: object
      additionalProperties: true
      required: [id, name, ownerId, archivedAt]
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string }
        teamImagePath: { type: [string, "null"] }
        archivedAt: { type: [string, "null"], format: date-time }
    FeeSettings:
      type: object
      required: [platformBasisPoints, stripeBasisPoints, stripeFixedMinor, revision]
      properties:
        platformBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
        stripeBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
        stripeFixedMinor:
          type: integer
          minimum: 0
          maximum: 1000000
        revision:
          type: integer
          minimum: 0
    FeeAuditEntry:
      type: object
      required: [id, before, after, createdAt]
      properties:
        id:
          type: string
        actorId:
          type: [string, "null"]
        before:
          $ref: "#/components/schemas/FeeSettings"
        after:
          $ref: "#/components/schemas/FeeSettings"
        createdAt:
          type: string
          format: date-time
    FeeAdminState:
      type: object
      required: [settings, audit, appliesTo, processingChargeNotice]
      properties:
        settings:
          $ref: "#/components/schemas/FeeSettings"
        audit:
          type: array
          items:
            $ref: "#/components/schemas/FeeAuditEntry"
        appliesTo:
          type: string
        processingChargeNotice:
          type: string
    PlatformAdminAccess:
      type: object
      required: [userId, isSuperAdmin]
      properties:
        userId: { type: string }
        isSuperAdmin: { type: boolean }
    PushTemplateInput:
      type: object
      additionalProperties: false
      required: [name, title, body]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 160 }
        body: { type: string, minLength: 1, maxLength: 1500 }
    PushTemplate:
      allOf:
        - $ref: "#/components/schemas/PushTemplateInput"
        - type: object
          required: [id, updatedAt]
          properties:
            id: { type: string }
            updatedAt: { type: string }
    PushNotificationInput:
      allOf:
        - $ref: "#/components/schemas/PushTriggerInput"
        - type: object
          required: [type]
          properties:
            type: { type: string, minLength: 1 }
    PushTriggerType:
      type: object
      required: [id, label, description, scheduled, allowedAudiences]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        scheduled: { type: boolean }
        allowedAudiences:
          type: array
          items: { type: string }
    PushTriggerInput:
      type: object
      additionalProperties: false
      required: [enabled, templateId, audience, reminderMinutes]
      properties:
        enabled: { type: boolean }
        templateId: { type: string, minLength: 1 }
        audience: { type: string, enum: [existing, attendees, maybe_voters, team_members, flare_recipients, payment_recipient] }
        reminderMinutes: { type: integer, minimum: 5, maximum: 10080 }
    PushTrigger:
      type: object
      required: [id, type, enabled, templateId, audience, reminderMinutes, label, description, scheduled, allowedAudiences, updatedAt]
      properties:
        id: { type: string }
        type: { type: string }
        enabled: { type: boolean }
        templateId: { type: ["string", "null"] }
        audience: { type: string, enum: [existing, attendees, maybe_voters, team_members, flare_recipients, payment_recipient] }
        reminderMinutes: { type: integer, minimum: 5, maximum: 10080 }
        label: { type: string }
        description: { type: string }
        scheduled: { type: boolean }
        allowedAudiences:
          type: array
          items: { type: string }
        updatedAt: { type: ["string", "null"] }
    PushPreviewInput:
      type: object
      additionalProperties: false
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        body: { type: string, minLength: 1, maxLength: 1500 }
    PushPreview:
      type: object
      required: [title, body]
      properties:
        title: { type: string }
        body: { type: string }
    PushTestInput:
      type: object
      additionalProperties: false
      required: [templateId]
      properties:
        templateId: { type: string, minLength: 1 }
    ApplePushDeviceInput:
      type: object
      additionalProperties: false
      required: [token, environment, installationId]
      properties:
        bundleId: { type: string, minLength: 1, maxLength: 255 }
        token: { type: string, pattern: "^[a-fA-F0-9]{32,512}$" }
        environment: { type: string, enum: [sandbox, production] }
        installationId: { type: string, minLength: 16, maxLength: 100 }
    PushDeviceRemoval:
      type: object
      additionalProperties: false
      required: [installationId]
      properties:
        installationId: { type: string, minLength: 16, maxLength: 100 }
    PushDeviceResult:
      type: object
      required: [registered]
      properties:
        registered: { type: boolean }
    PushDelivery:
      type: object
      required: [id, triggerId, title, status, attempts, createdAt, environment]
      properties:
        id: { type: string }
        triggerId: { type: string }
        title: { type: string }
        status: { type: string }
        attempts: { type: integer }
        createdAt: { type: string }
        environment: { type: string }
        reason: { type: [string, "null"] }
        acceptedAt: { type: [string, "null"] }
    NotificationAdminState:
      type: object
      required: [configuration, templates, triggers, triggerTypes, deliveries, placeholders]
      properties:
        configuration:
          type: object
          required: [configured, missing, bundleId, deviceCount, ownDeviceCount]
          properties:
            configured: { type: boolean }
            missing:
              type: array
              items: { type: string }
            bundleId: { type: string }
            deviceCount: { type: integer }
            ownDeviceCount: { type: integer }
            outboxReady: { type: boolean }
            paymentHooksReady: { type: boolean }
            applicationQueueEnabled: { type: boolean }
        templates:
          type: array
          items: { $ref: "#/components/schemas/PushTemplate" }
        triggers:
          type: array
          items: { $ref: "#/components/schemas/PushTrigger" }
        triggerTypes:
          type: array
          items: { $ref: "#/components/schemas/PushTriggerType" }
        deliveries:
          type: array
          items: { $ref: "#/components/schemas/PushDelivery" }
        placeholders:
          type: array
          items: { type: string }
    GoogleMobileSignInRequest:
      type: object
      additionalProperties: false
      properties:
        ticket:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
      required: [ticket, code_verifier]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

